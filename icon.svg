<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<!-- Background -->
	<rect width="512" height="512" rx="80" fill="#1a1a1a"/>

	<!-- Outer ring: 8 segments, 4 light -->
	<circle cx="256" cy="256" r="240" fill="#2a2a2a"/>
	<g fill="#777">
		<path d="M256,256 L256.0,16.0 A240,240 0 0,1 425.7,86.3 Z"/>
		<path d="M256,256 L496.0,256.0 A240,240 0 0,1 425.7,425.7 Z"/>
		<path d="M256,256 L256.0,496.0 A240,240 0 0,1 86.3,425.7 Z"/>
		<path d="M256,256 L16.0,256.0 A240,240 0 0,1 86.3,86.3 Z"/>
	</g>

	<!-- Middle ring: 6 segments, Tableau 10 palette -->
	<circle cx="256" cy="256" r="170" fill="#222"/>
	<g>
		<path d="M256,256 L256.0,86.0 A170,170 0 0,1 341.0,108.8 Z" fill="#e15759"/>
		<path d="M256,256 L403.2,171.0 A170,170 0 0,1 426.0,256.0 Z" fill="#f28e2b"/>
		<path d="M256,256 L403.2,341.0 A170,170 0 0,1 341.0,403.2 Z" fill="#59a14f"/>
		<path d="M256,256 L256.0,426.0 A170,170 0 0,1 171.0,403.2 Z" fill="#76b7b2"/>
		<path d="M256,256 L108.8,341.0 A170,170 0 0,1 86.0,256.0 Z" fill="#4e79a7"/>
		<path d="M256,256 L108.8,171.0 A170,170 0 0,1 171.0,108.8 Z" fill="#edc948"/>
	</g>

	<!-- Inner ring: 3 segments -->
	<circle cx="256" cy="256" r="100" fill="#1a1a1a"/>
	<g fill="#555" opacity="0.5">
		<path d="M256,256 L256.0,156.0 A100,100 0 0,1 342.6,206.0 Z"/>
		<path d="M256,256 L342.6,306.0 A100,100 0 0,1 256.0,356.0 Z"/>
		<path d="M256,256 L169.4,306.0 A100,100 0 0,1 169.4,206.0 Z"/>
	</g>

	<!-- Center hub -->
	<circle cx="256" cy="256" r="40" fill="#2a2a2a"/>
	<circle cx="256" cy="256" r="16" fill="#383838"/>
	<circle cx="256" cy="256" r="5" fill="#76b7b2"/>
</svg>
