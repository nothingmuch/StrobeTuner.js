<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Tuner</title>

		<script src="pitches.js"></script>
		<script src="tuner.js"></script>
	</head>

	<body>
		<p id="hint">Click anywhere (or press a key) and allow microphone access to start.</p>

		<div id="controls">
			<label for="preset-select">Tuning: </label>
			<select id="preset-select"></select>

			<br>

			<label for="gain-slider">Gain: </label>
			<input type="range" id="gain-slider" min="50" max="500" value="200" step="1">
			<span id="gain-value">200</span>

			<br>

			<label for="filter-width-slider">Filter width (semitones): </label>
			<input type="range" id="filter-width-slider" min="0.25" max="2.0" value="1.0" step="0.25">
			<span id="filter-width-value">1.0</span>

			<br>

			<label for="filter-order-select">Filter order (taps): </label>
			<select id="filter-order-select">
				<option value="256">256</option>
				<option value="512" selected>512</option>
				<option value="1024">1024</option>
			</select>

			<br>

			<label for="reference-pitch-input">Reference pitch (Hz): </label>
			<input type="number" id="reference-pitch-input" min="400" max="480" value="440" step="1">
		</div>

		<!-- canvas elements for strobe display are created dynamically by tuner.js -->
		<div id="strobe-container"></div>
	</body>
</html>
